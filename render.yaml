services:
  - type: web
    name: cineseya
    runtime: node
    plan: standard
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    domains:
      - cineseya.lk
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4001
      - key: NEXT_PUBLIC_SITE_URL
        value: https://cineseya.lk
      - key: NEXT_PUBLIC_SITE_NAME
        value: CineSeya.lk
      - key: CINESEYA_DEMO_MODE
        value: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: cinerusubs
      - key: SESSION_SECRET
        generateValue: true
      - key: DOWNLOAD_SIGNING_SECRET
        generateValue: true
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_MEDIA_BUCKET
        sync: false
      - key: R2_ASSETS_BUCKET
        sync: false
      - key: PUBLIC_ASSET_DOMAIN
        sync: false
      - key: DOWNLOAD_DOMAIN
        sync: false
      - key: DOWNLOAD_WORKER_ENABLED
        value: false
      - key: TRANSCODE_WORKER_ENABLED
        value: false
      - key: STREAM_SESSION_TTL_SECONDS
        value: 14400
      - key: TMDB_API_TOKEN
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false
  - type: worker
    name: cineseya-transcoder
    runtime: node
    plan: standard
    buildCommand: npm ci
    startCommand: npm run worker:transcode
    maxShutdownDelaySeconds: 300
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: cinerusubs
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_MEDIA_BUCKET
        sync: false
      - key: R2_ASSETS_BUCKET
        sync: false
      - key: TRANSCODE_WORKER_ENABLED
        value: true
      - key: TRANSCODE_CONCURRENCY
        value: 1
      - key: TRANSCODE_TEMP_DIR
        value: /tmp/cineseya-transcode
      - key: TRANSCODE_PROFILE_VERSION
        value: 1
      - key: TRANSCODE_MAX_ATTEMPTS
        value: 2
      - key: TRANSCODE_SEGMENT_SECONDS
        value: 6
      - key: TRANSCODE_POLL_INTERVAL_MS
        value: 5000
